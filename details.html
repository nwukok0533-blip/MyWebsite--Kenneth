<body>

    <h1 style="color: darkblue;">Details About HTML Tags</h1>

    <h2>What Are HTML Tags?</h2>
    <p>
        HTML tags are used to create and structure web pages.
        They tell the browser how to display content.
    </p>

    <h3>Examples of HTML Tags</h3>
    <p>
        The <b>heading tag</b> is used for titles.
        The <i>paragraph tag</i> is used for writing text.
        The <u>underline tag</u> is used to underline words.
    </p>

</body>
